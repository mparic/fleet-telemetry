# .github/workflows/sync-upstream.yml
name: Sync upstream Tesla repo

on:
  schedule:
    - cron: "0 0 * * 1" # every Monday at midnight UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/teslamotors/fleet-telemetry.git
          git fetch upstream main

      - name: Merge upstream into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          # Keep our versions of files that intentionally diverge from upstream.
          # Working-tree only — not staged or committed.
          printf '.github/workflows/* merge=ours\nDockerfile merge=ours\n' > .gitattributes
          git merge upstream/main --no-edit
          rm .gitattributes
          git push origin main
