# .github/workflows/sync-upstream.yml
name: Sync upstream Tesla repo

on:
  schedule:
    - cron: "0 0 * * 1" # every Monday at midnight UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/teslamotors/fleet-telemetry.git
          git fetch upstream main

      - name: Merge upstream into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          # Prevent Dockerfile conflict (intentional permanent divergence from upstream).
          # Working-tree only — not staged or committed.
          printf 'Dockerfile merge=ours\n' > .gitattributes
          git merge upstream/main --no-edit
          rm .gitattributes
          # GITHUB_TOKEN cannot push workflow file changes. Restore our versions
          # and amend the merge commit so the push never includes workflow changes.
          git checkout HEAD^ -- .github/workflows/
          git diff --cached --quiet || git commit --amend --no-edit
          git push origin main
