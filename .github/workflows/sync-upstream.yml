# .github/workflows/sync-upstream.yml
name: Sync upstream Tesla repo

on:
  schedule:
    - cron: "0 0 * * 1" # every Monday at midnight UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/teslamotors/fleet-telemetry.git
          git fetch upstream main

      - name: Merge upstream into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          # Keep our workflow files — upstream CI config isn't relevant to this fork
          # and pushing workflow changes requires a PAT we don't want to manage.
          # This is a working-tree-only change; it is not committed.
          printf '.github/workflows/* merge=ours\n' > .gitattributes
          if ! git merge upstream/main --no-edit; then
            git diff --name-only --diff-filter=U | xargs git checkout HEAD --
            git add -A
            git commit --no-edit
          fi
          rm .gitattributes
          git push origin main
